[package]
name = "macro-identity"
version = "0.0.0"
edition = "2021"

[dependencies]
facade = { package = "macro-facade", path = "facade" }
bangs = { package = "bang-only", path = "bangs" }

[features]
glob-derive = []
glob-test = []
glob-derive-attribute = []
glob-tool = []
glob-qualified = []
explicit-inline = []
macro-use-test = []
macro-use-derive = []
macro-use-bang = []
expanded-rebinding = []
expanded-macro-use = []
no-prelude = []
no-prelude-glob = ["no-prelude"]
no-std = []

[workspace]
members = ["bangs", "facade", "macros"]
exclude = ["registry"]
